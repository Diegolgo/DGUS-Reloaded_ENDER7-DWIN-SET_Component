[gcode_macro FILAMENT_CHANGE]
description: Pausa la impresion para cambio manual de filamento
variable_temp_objetivo: 0
gcode:
    {% set X     = params.X|default(10)|float %}
    {% set Y     = params.Y|default(10)|float %}
    {% set Z_HOP = params.Z_HOP|default(10)|float %}

    # Guardar temperatura objetivo para recuperarla al reanudar
    SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=temp_objetivo VALUE={printer.extruder.target}

    # Retraccion rapida para evitar goteo
    {% if printer[printer.toolhead.extruder].can_extrude %}
        M83
        G1 E-3 F3600
    {% endif %}

    # Subir Z para no golpear la pieza
    {% set z_nueva = [printer.toolhead.position.z + Z_HOP, printer.toolhead.axis_maximum.z]|min %}
    G90
    G1 Z{z_nueva} F900

    # Mover a posicion de cambio (frente izquierdo por defecto)
    G1 X{X} Y{Y} F9000

    # Retraer filamento para facilitar la extraccion manual
    {% if printer[printer.toolhead.extruder].can_extrude %}
        G1 E-50 F300
    {% endif %}

    # Mensaje de instrucciones
    M117 Esperando cambio de filamento...
    RESPOND TYPE=echo MSG="======================================"
    RESPOND TYPE=echo MSG="        CAMBIO DE FILAMENTO"
    RESPOND TYPE=echo MSG="======================================"
    RESPOND TYPE=echo MSG="1. Retira el filamento actual"
    RESPOND TYPE=echo MSG="2. Inserta el nuevo filamento hasta el hotend"
    RESPOND TYPE=echo MSG="3. Ejecuta RESUME_FILAMENTO para continuar"
    RESPOND TYPE=echo MSG="======================================"

    PAUSE


[gcode_macro RESUME_FILAMENTO]
description: Purga el nuevo filamento y reanuda la impresion
gcode:
    {% set PURGA = params.PURGA|default(30)|float %}
    {% set TEMP  = printer["gcode_macro FILAMENT_CHANGE"].temp_objetivo %}

    # Recalentar al objetivo original si el hotend se enfrio
    {% if printer.extruder.temperature < TEMP - 5 %}
        RESPOND TYPE=echo MSG="Calentando hotend a {TEMP|int}C..."
        M109 S{TEMP}
    {% endif %}

    # Purgar nuevo filamento
    RESPOND TYPE=echo MSG="Purgando {PURGA|int}mm de filamento..."
    M83
    G1 E{PURGA} F200
    G1 E-2 F3600

    M117 Reanudando impresion...
    RESPOND TYPE=echo MSG="Reanudando impresion..."

    RESUME
