################################################
##### macro para habilitar m600 (probar) ################
[gcode_macro M600]
gcode:
    G1 Y125 F9000
    G1 E-600 F1200
    G1 X220 F9000
    G1 Y35 F9000
    PAUSE
    
[gcode_macro CLEAN_NOZZLE]
gcode:
    SAVE_GCODE_STATE NAME=pre_nozzle_clean
    # Absolute positioning
    G90
    G1 X0 Y0 F9000
    G1 Z3
    G1 X0 Y60 F9000
    G1 X0 Y0 F9000
    G1 X0 Y60 F9000
    G1 X0 Y0 F9000
    G1 X0 Y60 F9000
    G1 X0 Y0 F9000
    RESTORE_GCODE_STATE NAME=pre_nozzle_clean
    
    
[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    #DGUS_PRINT_END
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
    
[gcode_macro CHANGE_FILAMENT]
gcode:
    # PAUSE: Mover el cabezal a un lugar seguro y pausar la impresión
    PAUSE
    # PUSH_FILAMENT: Retirar el filamento actual
    PUSH_FILAMENT
    # Wait for filament change: Esperar a que el usuario confirme el cambio
    WAIT_FOR_FILAMENT_CHANGE
    # RESUME: Volver a la impresión
    RESUME
    
[gcode_macro BEEP]
description: BEEP I=3 DUR=200 FREQ=2000: Beep 3 times, for 200ms each, at 2kHz frequency.
gcode:
    # Parameters
    {% set i = params.I|default(1)|int %}           ; Iterations (number of times to beep).
    {% set dur = [params.DUR|default(100)|int,255] | min %}     ; Duration/wait of each beep in ms. Default 100ms.
    ;{% set freq = params.FREQ|default(2000)|int %}  ; Frequency in Hz. Default 2kHz, not supported sv06+
    
    {% for iteration in range(i|int) %}
    M300 P{dur}
    G4 P{dur}
    {% endfor %}

